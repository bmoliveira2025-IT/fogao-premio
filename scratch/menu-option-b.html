<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fogão 360 — Menu mobile B</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --accent: #f6c742;
      --accent-soft: #ffe78e;
      --accent-rgb: 246, 199, 66;
      --ink: #111214;
      --dock: #161719;
      --muted: #8f9299;
      --line: #e8e8e8;
    }
    body:has(#gloriosa:checked) {
      --accent: #ec5e9b;
      --accent-soft: #ffb9d5;
      --accent-rgb: 236, 94, 155;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #d9dadd;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .phone {
      position: relative;
      width: 390px;
      height: 844px;
      overflow: hidden;
      background: #f8f8f8;
      box-shadow: 0 22px 65px rgba(0,0,0,.22);
    }
    header {
      height: 88px;
      padding: 23px 20px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-bottom: 1px solid #ededed;
    }
    .brand { display: flex; gap: 11px; align-items: center; }
    .crest {
      width: 43px; height: 43px; border-radius: 50%;
      display: grid; place-items: center;
      background: #111; color: var(--accent);
      border: 2px solid var(--accent);
      box-shadow: 0 0 0 3px #fff, 0 0 0 4px #dedede;
      font-size: 22px;
    }
    .brand-copy strong { display: block; color: var(--accent); font-size: 19px; letter-spacing: -.5px; }
    .brand-copy span { color: #9b9ca1; font-size: 10px; letter-spacing: 1.7px; font-weight: 800; }
    .avatar { width: 37px; height: 37px; border-radius: 50%; background: #e9e9e9; border: 1px solid #ddd; }
    main { padding: 18px 18px 120px; }
    .hero {
      height: 215px; border-radius: 25px; padding: 23px;
      display: flex; flex-direction: column; justify-content: flex-end;
      color: white; background: linear-gradient(145deg, #252628, #070708);
      box-shadow: 0 11px 24px rgba(17,18,20,.13);
    }
    .pill { width: max-content; padding: 6px 10px; border-radius: 999px; background: var(--accent); color: #111; font-size: 11px; font-weight: 900; }
    .hero h1 { margin: 12px 0 0; font-size: 23px; line-height: 1.07; letter-spacing: -.6px; }
    .filters { display: flex; gap: 9px; margin: 18px 0; }
    .filter { height: 36px; padding: 0 15px; border: 1px solid #ddd; border-radius: 999px; display: grid; place-items: center; background: #fff; font-size: 12px; font-weight: 750; color: #666; }
    .filter.active { background: #171719; color: #fff; border-color: #171719; }
    .story {
      height: 91px; margin-bottom: 12px; padding: 13px;
      display: grid; grid-template-columns: 65px 1fr; gap: 13px;
      background: #fff; border: 1px solid var(--line); border-radius: 19px;
    }
    .thumb { border-radius: 13px; background: linear-gradient(135deg,#d8d8d8,#a8a9ac); }
    .lines { padding-top: 3px; }
    .line { height: 9px; margin-bottom: 9px; border-radius: 10px; background: #dedfe1; }
    .line.dark { width: 93%; background: #242528; height: 11px; }
    .line.short { width: 56%; }
    .dock-wrap {
      position: absolute;
      left: 14px; right: 14px; bottom: 16px;
      padding: 5px;
      border-radius: 27px;
      background: rgba(255,255,255,.64);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 34px rgba(0,0,0,.21);
    }
    nav {
      height: 78px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      padding: 6px;
      border-radius: 23px;
      background: linear-gradient(180deg, #1f2023, #111214);
      border: 1px solid #303135;
    }
    .nav-item {
      position: relative;
      height: 64px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; color: var(--muted);
      font-size: 10px; font-weight: 750;
    }
    .nav-item.active { color: var(--accent); }
    .nav-item.active::before {
      content: "";
      position: absolute;
      inset: 3px 5px;
      border-radius: 17px;
      background: linear-gradient(180deg, rgba(var(--accent-rgb),.18), rgba(var(--accent-rgb),.06));
      border: 1px solid rgba(var(--accent-rgb),.22);
    }
    .icon {
      position: relative; z-index: 1;
      width: 27px; height: 27px;
      display: grid; place-items: center;
      font-size: 22px; line-height: 1;
      filter: grayscale(1);
    }
    .active .icon { filter: none; }
    .label { position: relative; z-index: 1; }
    .active-dot {
      position: absolute; z-index: 2;
      top: 4px; right: 11px;
      width: 5px; height: 5px; border-radius: 50%; background: var(--accent-soft);
      box-shadow: 0 0 8px var(--accent);
    }
    .theme-switch {
      position: absolute; z-index: 5; top: 94px; right: 18px;
      display: flex; gap: 3px; padding: 3px;
      background: rgba(255,255,255,.9); border: 1px solid #ddd; border-radius: 999px;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }
    .theme-switch input { position: absolute; opacity: 0; pointer-events: none; }
    .theme-switch label { padding: 5px 8px; border-radius: 999px; font-size: 9px; font-weight: 850; cursor: pointer; color: #777; }
    #glorioso:checked + label, #gloriosa:checked + label { color: #111; background: var(--accent); }
    @media (max-width: 390px) {
      .phone { width: 100vw; height: 100vh; }
    }
  </style>
</head>
<body>
  <section class="phone" aria-label="Mockup mobile Fogão 360">
    <div class="theme-switch" aria-label="Alternar tema">
      <input id="glorioso" type="radio" name="theme" checked><label for="glorioso">GLORIOSO</label>
      <input id="gloriosa" type="radio" name="theme"><label for="gloriosa">GLORIOSA</label>
    </div>
    <header>
      <div class="brand">
        <div class="crest">★</div>
        <div class="brand-copy"><strong>360</strong><span>O PORTAL DO BOTAFOGO</span></div>
      </div>
      <div class="avatar"></div>
    </header>
    <main>
      <article class="hero">
        <span class="pill">DESTAQUE</span>
        <h1>Notícias do Glorioso<br>em primeira mão</h1>
      </article>
      <div class="filters">
        <span class="filter active">Para você</span><span class="filter">Mercado</span><span class="filter">Jogos</span>
      </div>
      <article class="story"><div class="thumb"></div><div class="lines"><div class="line dark"></div><div class="line dark short"></div><div class="line short"></div></div></article>
      <article class="story"><div class="thumb"></div><div class="lines"><div class="line dark"></div><div class="line dark short"></div><div class="line short"></div></div></article>
      <article class="story"><div class="thumb"></div><div class="lines"><div class="line dark"></div><div class="line dark short"></div><div class="line short"></div></div></article>
    </main>
    <div class="dock-wrap">
      <nav aria-label="Navegação principal">
        <div class="nav-item active"><i class="active-dot"></i><span class="icon">⌂</span><span class="label">Início</span></div>
        <div class="nav-item"><span class="icon">♜</span><span class="label">Tabela</span></div>
        <div class="nav-item"><span class="icon">▦</span><span class="label">Jogos</span></div>
        <div class="nav-item"><span class="icon">▷</span><span class="label">Vídeos</span></div>
        <div class="nav-item"><span class="icon">♙</span><span class="label">Perfil</span></div>
      </nav>
    </div>
  </section>
</body>
</html>
