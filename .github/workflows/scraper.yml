name: Scraper

on:
  schedule:
    - cron: "*/22 * * * *" # Executa a cada 22 minutos
  workflow_dispatch: # Permite execução manual
  push:
    branches:
      - main # Executa ao dar push na main

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Otimiza o tempo de execução em rodadas futuras

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          # pip 26.2.1 fails with "resolution-too-deep" while resolving the
          # Firebase/Gemini dependency graph. Keep the last known-good resolver
          # version so scheduled runs remain reproducible.
          python -m pip install "pip==26.1.2"
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          GITHUB_ACTIONS: "true"
        run: python backend/scraper.py

      - name: Commit and Push Run
        run: |
          git config --global user.name 'actions-user'
          git config --global user.email 'actions@github.com'
          date > last_scraper_run.txt
          git add last_scraper_run.txt
          git add portal/src/data/schedule.ts
          if git diff --cached --quiet; then
            echo "No schedule or run marker changes to publish."
          else
            git commit -m "Scraper Run: $(date)"
            git pull --rebase -X theirs
            git push
          fi
